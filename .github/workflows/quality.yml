name: Rummy quality checks

on:
  push:
    branches:
      - main
      - fix/gameplay-reliability-ai-polish
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Type-check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
